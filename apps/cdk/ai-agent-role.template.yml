AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Role for AI Agent (Kiro) - Agentic Analyst operator role with least privilege

Resources:
  AIOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AgenticAnalyst-OperatorRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess'
      Tags:
        - Key: Application
          Value: Agentic Analyst
      Policies:
        - PolicyName: CDKDeployAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeRoleCDKBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-*'
                Condition:
                  StringEquals:
                    iam:ResourceTag/aws-cdk:bootstrap-role:
                      - deploy
                      - file-publishing
                      - image-publishing
                      - lookup

        - PolicyName: OperationalAccessWithABAC
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: Agentic Analyst

              # S3 汎用バケットの ABAC は既定で無効なので aws:ResourceTag は効かない。
              # CDK が自動命名するバケット名（<env>-agenticanalyst-... / agenticanalyst-...）で絞る。
              - Sid: S3ObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::*agenticanalyst-*/*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

              - Sid: CdkStagingBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::cdk-*-assets-${AWS::AccountId}-*/cfn-templates/*'

              - Sid: CognitoUserManagement
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: Agentic Analyst

              # ローカルの chat-agent / webapp がセッション履歴を AgentCore Memory に書く
              # （apps/chat-agent/src/session/agentcore-memory-storage.ts, apps/webapp/src/app/api/sessions/route.ts）
              - Sid: AgentCoreMemoryEvents
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:DeleteEvent
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: Agentic Analyst

              # Cognito ID Token → IdC Access Token の交換（apps/chat-agent/src/index.ts, packages/datazone-auth/src/project-credentials.ts）。
              # IdC Application は手動作成でタグが無いので、アカウント内の Application ARN で絞る。
              - Sid: IdcTokenExchange
                Effect: Allow
                Action:
                  - sso-oauth:CreateTokenWithIAM
                Resource: !Sub 'arn:${AWS::Partition}:sso::${AWS::AccountId}:application/*'

        - PolicyName: OperationalAccessGlobal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogsInsights
                Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:StopQuery
                Resource: '*'

              - Sid: CloudTrailLake
                Effect: Allow
                Action:
                  - cloudtrail:StartQuery
                  - cloudtrail:DescribeQuery
                  - cloudtrail:GetQueryResults
                Resource: '*'

              - Sid: AthenaQueryExecution
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: '*'

              - Sid: BedrockRuntime
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

              # AWS 管理の Code Interpreter（apps/chat-agent/src/code-interpreter-tool.ts）
              - Sid: AgentCoreCodeInterpreter
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartCodeInterpreterSession
                  - bedrock-agentcore:InvokeCodeInterpreter
                  - bedrock-agentcore:StopCodeInterpreterSession
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:*:aws:code-interpreter/aws.codeinterpreter.v1'

              # ReadOnlyAccess に含まれない DataZone の読み取り
              - Sid: DataZoneConnections
                Effect: Allow
                Action:
                  - datazone:GetConnection
                  - datazone:ListConnections
                Resource: '*'

              # 調査クエリではなく credential vending。環境ユーザーロールの一時認証情報を返す。
              # アプリは DomainExecutionRole の認証情報で呼ぶ（packages/datazone-auth/src/project-credentials.ts）ので
              # このロールでは使わないが、運用での手動調査用に意図して残す。resource-level 制御は無い。
              - Sid: DataZoneEnvironmentCredentials
                Effect: Allow
                Action:
                  - datazone:GetEnvironmentCredentials
                Resource: '*'

Outputs:
  RoleArn:
    Description: ARN of the AIOperatorRole
    Value: !GetAtt AIOperatorRole.Arn
  RoleName:
    Description: Name of the AIOperatorRole
    Value: !Ref AIOperatorRole
